name: yourist

# общий образ backend: один код, разные роли (миграции, api, corpus);
# слои собираются один раз и берутся из кэша
x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yourist}:${POSTGRES_PASSWORD:-yourist}@db:5432/${POSTGRES_DB:-yourist}
    # Ollama работает на хосте (ей нужна видеокарта), а не в контейнере
    OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
  # на Linux-сервере host.docker.internal сам не появляется
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    # PostgreSQL с расширением pgvector — пригодится для поиска по законам
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yourist}
      POSTGRES_USER: ${POSTGRES_USER:-yourist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourist}
    # только localhost: снаружи (по статическому IP) база недоступна
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # применяет миграции и завершается; api и corpus стартуют после него
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  # основной API: пользователи, вопросы к ассистенту, настройки нейросетей
  api:
    <<: *backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      DEID_URL: http://deid:8002
    depends_on:
      migrate:
        condition: service_completed_successfully
      deid:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  # деперсонализация — граница персональных данных: без БД, без публикации порта,
  # доступна только api по внутренней сети compose
  deid:
    <<: *backend
    command: ["sh", "-c", "exec uvicorn app.deid_main:app --host 0.0.0.0 --port \"$$PORT\""]
    restart: unless-stopped
    environment:
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      PORT: "8002"
    # модели Whisper (распознавание голоса) скачиваются при первом запросе и хранятся здесь
    volumes:
      - hf-cache:/home/yourist/.cache/huggingface

  # сервис корпуса законов: синхронизация с pravo.gov.ru по расписанию
  corpus:
    <<: *backend
    command: ["sh", "-c", "exec uvicorn app.corpus_main:app --host 0.0.0.0 --port \"$$PORT\" --proxy-headers"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      PORT: "8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  pgdata:
  hf-cache:
