name: yourist

services:
  db:
    # PostgreSQL с расширением pgvector — пригодится для поиска по законам
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yourist}
      POSTGRES_USER: ${POSTGRES_USER:-yourist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourist}
    # только localhost: снаружи (по статическому IP) база недоступна
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yourist}:${POSTGRES_PASSWORD:-yourist}@db:5432/${POSTGRES_DB:-yourist}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
