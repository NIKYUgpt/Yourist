[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yourist-backend"
version = "0.1.0"
description = "Yourist — экспертная система для правового анализа на базе ИИ (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pydantic-settings>=2.16,<3",
    "email-validator>=2.3,<3",
    "pyjwt>=2.15,<3",
    "argon2-cffi>=25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "httpx>=0.28,<1",
    "ruff>=0.17,<0.18",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# FastAPI-зависимости в аргументах по умолчанию — штатный приём
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
